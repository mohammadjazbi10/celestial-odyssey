[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celestial-odyssey-data"
version = "0.1.0"
description = "Real-data TESS acquisition pipeline for Celestial Odyssey"
requires-python = ">=3.10"
dependencies = [
  "lightkurve>=2.5", "astroquery>=0.4.7", "astropy>=6.0",
  "pandas>=2.0", "numpy>=1.26", "matplotlib>=3.8", "requests>=2.31", "scipy>=1.11"
]

[project.scripts]
celestial-data = "celestial_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["celestial_pipeline*"]
